<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDXP | Playing</title>
    <style>
        /* 1. Base Styles */
        body, html {
            margin: 0; padding: 0;
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* Keeps it tight and clean */
        }

        /* 2. Top Header */
        nav {
            background-color: #0c0c0c;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 2px solid #d4af37; /* Gold Accent Line */
        }

        .menu-icon {
            position: absolute;
            left: 20px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .menu-icon div { width: 25px; height: 3px; background-color: #fff; }

        .logo {
            font-size: 38px;
            font-weight: 900;
            color: #ff3e3e; 
            letter-spacing: -2px;
            text-transform: uppercase;
            text-shadow: 3px 3px 0px #000;
            cursor: pointer;
        }

        /* 3. Game Layout Area */
        .game-wrapper {
            max-width: 1100px;
            margin: 40px auto; /* Centered with top spacing */
            padding: 0 20px;
        }

        .iframe-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px 8px 0 0;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        iframe { width: 80%; height: 70%; border: none; }

        /* 4. Control Bar (Under Game) */
        .control-bar {
            background-color: #2b2b2b;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .game-title { font-weight: bold; font-size: 18px; text-transform: uppercase; }
        .star-icon { color: #fff; font-size: 20px; opacity: 0.6; }

        .fs-btn {
            background-color: #ff8c00; /* Orange Fullscreen Button */
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
            transition: 0.2s;
        }
        .fs-btn:hover { background-color: #ffae42; transform: scale(1.05); }
    </style>
</head>
<body>

    <!-- Top Header -->
    <nav>
        <div class="menu-icon" onclick="window.location.href='index.html'">
            <div></div><div></div><div></div>
        </div>
        <div class="logo" onclick="window.location.href='index.html'">SDXP</div>
    </nav>

    <div class="game-wrapper">
        <!-- The Game Viewport -->
        <div class="iframe-container">
            <iframe id="game-frame" src=""></iframe>
        </div>

        <!-- Grey Control Bar -->
        <div class="control-bar">
            <div id="display-title" class="game-title">Loading...</div>
            <div class="star-icon">☆</div>
            <button class="fs-btn" onclick="openFullscreen()">Fullscreen</button>
        </div>
    </div>

    <script>
        // Grab info from the URL (sent by games.js buildStash)
        const params = new URLSearchParams(window.location.search);
        const gameUrl = params.get('url');
        const gameName = params.get('name');

        // Load the actual game file into the iframe
        if (gameUrl) {
            document.getElementById('game-frame').src = decodeURIComponent(gameUrl);
        }

        // Set the title in the control bar and browser tab
        if (gameName) {
            const cleanName = decodeURIComponent(gameName);
            document.getElementById('display-title').innerText = cleanName;
            document.title = "SDXP | Playing " + cleanName;
        }

        // Fullscreen Logic
        function openFullscreen() {
            const elem = document.getElementById("game-frame");
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }
    </script>
</body>
</html>
