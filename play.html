<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> School | Playing</title>
    <style>
    /* 1. BASE LAYOUT - MATTE CHARCOAL (Fixes white screen) */
    body, html {
        margin: 0; padding: 0;
        background-color: #2b2b2b; /* Matches Index */
        color: #fff;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow-x: hidden;
    }

    /* 2. TOP HEADER (Blue Accent) */
    nav {
        background-color: #121212;
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        border-bottom: 2px solid #235bff; /* Your Blue */
        box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }

    .menu-icon { position: absolute; left: 20px; cursor: pointer; display: flex; flex-direction: column; gap: 5px; }
    .menu-icon div { width: 25px; height: 3px; background: #fff; }

    .logo {
        font-size: 38px;
        font-weight: 900;
        color: #235bff; /* Your Blue */
        letter-spacing: -2px;
        text-transform: uppercase;
        text-shadow: 3px 3px 0px #000;
        cursor: pointer;
    }

    /* 3. GAME WRAPPER (Centers the game on screen) */
    .game-wrapper {
        max-width: 1100px;
        margin: 40px auto; /* Centers horizontally */
        padding: 0 20px;
    }

    .iframe-container {
        width: 100%;
        height: 75vh; /* 75% of screen height */
        background: #000;
        border-radius: 12px 12px 0 0;
        overflow: hidden;
        box-shadow: 0 15px 40px rgba(0,0,0,0.7);
    }

    iframe { width: 100%; height: 100%; border: none; }

    /* 4. CONTROL BAR (Under Game) */
    .control-bar {
        background-color: #1a1a1a;
        padding: 15px 25px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-radius: 0 0 12px 12px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .game-title { 
        font-weight: 800; 
        font-size: 18px; 
        text-transform: uppercase; 
        color: #aaa; 
    }

    .fs-btn {
        background-color: #235bff; /* Your Blue */
        color: white;
        border: none;
        padding: 10px 22px;
        border-radius: 6px;
        font-weight: 900;
        cursor: pointer;
        text-transform: uppercase;
        font-size: 12px;
        transition: 0.2s;
        box-shadow: 0 4px 0px #1a44c2; /* 3D Button Depth */
    }

    .fs-btn:hover { background-color: #3e74ff; transform: translateY(-2px); }
    .fs-btn:active { transform: translateY(2px); box-shadow: none; }
</style>

</head>
<body>

    <nav>
        <div class="menu-icon" onclick="window.location.href='index.html?user=' + sessionStorage.getItem('user')">
            <div></div><div></div><div></div>
        </div>
        <div class="logo" onclick="window.location.href='index.html?user=' + sessionStorage.getItem('user')">SCHOOL| EDUCATION</div>
    </nav>

    <div class="game-wrapper">
        <div class="iframe-container">
            <!-- Added allowfullscreen and allow="fullscreen" for Chromebooks -->
           <iframe id="game-frame" 
        sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock" 
        allow="autoplay; fullscreen; keyboard; mouse-lock" 
        allowfullscreen>
</iframe>

        </div>

        <div class="control-bar">
            <div id="display-title" class="game-title">Loading...</div>
            <button class="fs-btn" onclick="openFullscreen()">Fullscreen</button>
        </div>
    </div>

    <!-- 1. Load your games list (Change URL if your games.js moved) -->
    <script src="https://fastly.jsdelivr.net/gh/goat-67/ugs-singlefile@main/src/games.js"></script>

              <script>

                  /* ================= PLAY PAGE TIMER SYSTEM ================= */
// get user from URL OR session
const params = new URLSearchParams(window.location.search);
let user = params.get("user") || sessionStorage.getItem("user");

// save it if it exists
if (user) {
  sessionStorage.setItem("user", user);
}

// your allowed users
const allowedUsers = ["manoftree", "wlucwar", "goat-67", "roberjam", "rykaboi"];

// block if invalid
if (!user || !allowedUsers.includes(user)) {
  document.body.innerHTML = "<h1 style='color:white;text-align:center;margin-top:20%'>Access Denied</h1>";
  throw new Error("Blocked");
}
const MAX_TIME = 45 * 60 * 1000; // 45 minutes

function getTodayKey() {
    return new Date().toDateString();
}

function getData() {
    return JSON.parse(localStorage.getItem("timeData")) || null;
}

function saveData(data) {
    localStorage.setItem("timeData", JSON.stringify(data));
}

function initTimeLimit() {
    const today = getTodayKey();
    let data = getData();

    if (!data || data.date !== today) {
        data = {
            date: today,
            timeSpent: 0,
            lastStart: Date.now(),
            bonusTime: 0,
            bonusUsed: false
        };
    } else {
        data.lastStart = Date.now();
    }

    saveData(data);

    createTimerUI();
    updateLoop();
}

/* ================= TIMER UI ================= */

function createTimerUI() {
    if (document.getElementById("time-remaining")) return;

    const timer = document.createElement("div");
    timer.id = "time-remaining";

    timer.style.position = "fixed";
    timer.style.bottom = "15px";
    timer.style.right = "20px";
    timer.style.padding = "10px 14px";
    timer.style.background = "rgba(0,0,0,0.6)";
    timer.style.backdropFilter = "blur(8px)";
    timer.style.color = "#fff";
    timer.style.fontSize = "13px";
    timer.style.borderRadius = "10px";
    timer.style.zIndex = "9999";
    timer.style.fontWeight = "600";

    document.body.appendChild(timer);
}

/* ================= MAIN LOOP ================= */

function updateLoop() {
    setInterval(() => {
        let data = getData();
        if (!data) return;

        const now = Date.now();

        const sessionTime = now - data.lastStart;
        const totalAllowed = MAX_TIME + (data.bonusTime || 0);
        const used = data.timeSpent + sessionTime;

        const remaining = totalAllowed - used;

        const timerEl = document.getElementById("time-remaining");

        if (timerEl) {
            timerEl.innerText = remaining > 0
                ? "Time Left: " + formatTime(remaining)
                : "Time Left: 0:00";
        }

        if (remaining <= 0) {
            lockSite();
            return;
        }

        data.timeSpent = used;
        data.lastStart = now;

        saveData(data);

    }, 1000);
}

function formatTime(ms) {
    let totalSeconds = Math.floor(ms / 1000);
    let minutes = Math.floor(totalSeconds / 60);
    let seconds = totalSeconds % 60;
    return `${minutes}:${seconds.toString().padStart(2, '0')}`;
}

/* ================= LOCK ================= */

function lockSite() {
    document.body.innerHTML = `
        <div style="
            display:flex;
            align-items:center;
            justify-content:center;
            height:100vh;
            background:#111;
            color:white;
            font-family:sans-serif;
            text-align:center;
        ">
            <div>
                <h1>Time Limit Reached</h1>
                <p>You’ve used your limit for today.</p>
                <p>Come back tomorrow.</p>
            </div>
        </div>
    `;
}

/* ================= START ================= */

initTimeLimit();
                  window.addEventListener("load", () => {
    if (sessionStorage.getItem("unlocked") === "true") {
        const overlay = document.getElementById("password-overlay");
        if (overlay) overlay.style.display = "none";
    }
});
    window.onload = () => {
        const params = new URLSearchParams(window.location.search);
        const gameId = params.get('id');
        const list = typeof allGames !== 'undefined' ? allGames : (typeof myGamesList !== 'undefined' ? myGamesList : []);

        // Find the game by filename so deleting games doesn't break links
        const game = list.find(g => g.gameUrl && g.gameUrl.endsWith(gameId));

        if (game) {
            // FIXED: Cleans the 'cl' from the title so it looks normal
            let cleanTitle = game.name;
            if (cleanTitle.toLowerCase().startsWith('cl')) cleanTitle = cleanTitle.substring(2);
            document.getElementById('display-title').innerText = cleanTitle.toUpperCase();

            const fileName = game.gameUrl.split('/').pop();
            // Using @latest as you specified
            const fetchUrl = `https://fastly.jsdelivr.net/gh/goat-67/ugs-singlefile@latest/UGS-Files/${fileName}`;

            fetch(fetchUrl)
                .then(r => r.text())
                .then(html => {
                    const frame = document.getElementById('game-frame');
                    let baseUrl = fetchUrl.substring(0, fetchUrl.lastIndexOf("/") + 1);
                    if (!baseUrl.endsWith('/')) baseUrl += '/';

                    const masterHeaders = `
                        <head>
                            <base href="${baseUrl}">
                            <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
                            <script>
                                window.ysdk = {
                                    features: {
                                        LoadingAPI: { ready: function() {} },
                                        GameplayAPI: {
                                            stop: function() { 
                                                if(window.ysdk.features.GameplayAPI.start) window.ysdk.features.GameplayAPI.start();
                                            },
                                            start: function() {}
                                        }
                                    },
                                    screen: { fullscreen: { status: "on" } },
                                    adv: {
                                        showFullscreenAdv: function(opt) {
                                            if (opt && opt.callbacks && opt.callbacks.onClose) {
                                                setTimeout(() => { opt.callbacks.onClose(true); }, 100);
                                            }
                                        }
                                    },
                                    getStorage: function() { return Promise.resolve({}); }
                                };

                                window.FullAdShow = function() { 
                                    if (window.unityInstance) {
                                        window.unityInstance.SendMessage('GameManager', 'ResumeGame');
                                        window.unityInstance.SendMessage('GameManager', 'Unpause');
                                    }
                                };
                                window.InitGame = function() {};
                                window.setInterval(() => {
                                    window.isAdShowing = false;
                                    window.isPaused = false;
                                    if (window.unityInstance && window.unityInstance.Module) {
                                        try { window.unityInstance.Module.resumeMainLoop(); } catch(e) {}
                                    }
                                }, 100);
                            <\/script>
                        </head>
                    `;

                    const frameDoc = frame.contentDocument || frame.contentWindow.document;
                    frameDoc.open();
                    frameDoc.write(masterHeaders + html);
                    frameDoc.close();
                })
                .catch(err => {
                    document.getElementById('display-title').innerText = "LOAD ERROR";
                });
        }
    };
                    function openFullscreen() {
        const elem = document.getElementById("game-frame");
        if (elem.requestFullscreen) { elem.requestFullscreen(); }
        else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); } 
    }

</script>
         








</body>
</html>
