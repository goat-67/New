<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> VORTEX | Playing</title>
    <style>
    /* 1. BASE LAYOUT - MATTE CHARCOAL (Fixes white screen) */
    body, html {
        margin: 0; padding: 0;
        background-color: #2b2b2b; /* Matches Index */
        color: #fff;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow-x: hidden;
    }

    /* 2. TOP HEADER (Blue Accent) */
    nav {
        background-color: #121212;
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        border-bottom: 2px solid #235bff; /* Your Blue */
        box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }

    .menu-icon { position: absolute; left: 20px; cursor: pointer; display: flex; flex-direction: column; gap: 5px; }
    .menu-icon div { width: 25px; height: 3px; background: #fff; }

    .logo {
        font-size: 38px;
        font-weight: 900;
        color: #235bff; /* Your Blue */
        letter-spacing: -2px;
        text-transform: uppercase;
        text-shadow: 3px 3px 0px #000;
        cursor: pointer;
    }

    /* 3. GAME WRAPPER (Centers the game on screen) */
    .game-wrapper {
        max-width: 1100px;
        margin: 40px auto; /* Centers horizontally */
        padding: 0 20px;
    }

    .iframe-container {
        width: 100%;
        height: 75vh; /* 75% of screen height */
        background: #000;
        border-radius: 12px 12px 0 0;
        overflow: hidden;
        box-shadow: 0 15px 40px rgba(0,0,0,0.7);
    }

    iframe { width: 100%; height: 100%; border: none; }

    /* 4. CONTROL BAR (Under Game) */
    .control-bar {
        background-color: #1a1a1a;
        padding: 15px 25px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-radius: 0 0 12px 12px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .game-title { 
        font-weight: 800; 
        font-size: 18px; 
        text-transform: uppercase; 
        color: #aaa; 
    }

    .fs-btn {
        background-color: #235bff; /* Your Blue */
        color: white;
        border: none;
        padding: 10px 22px;
        border-radius: 6px;
        font-weight: 900;
        cursor: pointer;
        text-transform: uppercase;
        font-size: 12px;
        transition: 0.2s;
        box-shadow: 0 4px 0px #1a44c2; /* 3D Button Depth */
    }

    .fs-btn:hover { background-color: #3e74ff; transform: translateY(-2px); }
    .fs-btn:active { transform: translateY(2px); box-shadow: none; }
</style>

</head>
<body>

    <nav>
        <div class="menu-icon" onclick="window.location.href='index.html'">
            <div></div><div></div><div></div>
        </div>
        <div class="logo" onclick="window.location.href='index.html'">VORTEX | ULTIMATE GAME HUB</div>
    </nav>

    <div class="game-wrapper">
        <div class="iframe-container">
            <!-- Added allowfullscreen and allow="fullscreen" for Chromebooks -->
           <iframe id="game-frame" 
        sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock" 
        allow="autoplay; fullscreen; keyboard; mouse-lock" 
        allowfullscreen>
</iframe>

        </div>

        <div class="control-bar">
            <div id="display-title" class="game-title">Loading...</div>
            <button class="fs-btn" onclick="openFullscreen()">Fullscreen</button>
        </div>
    </div>

    <!-- 1. Load your games list (Change URL if your games.js moved) -->
    <script src="https://fastly.jsdelivr.net/gh/goat-67/ugs-singlefile@main/src/games.js"></script>
<script>
    window.onload = () => {
        const params = new URLSearchParams(window.location.search);
        const gameId = params.get('id');
        const list = typeof allGames !== 'undefined' ? allGames : (typeof myGamesList !== 'undefined' ? myGamesList : null);

        if (list && list[gameId]) {
            const game = list[gameId];
            
            // 1. TITLE CLEANER (Removes 'cl' and 'y')
            let cleanTitle = game.name;
            if (cleanTitle.toLowerCase().startsWith('cl')) cleanTitle = cleanTitle.substring(2);
            if (cleanTitle.toLowerCase().endsWith('y')) cleanTitle = cleanTitle.slice(0, -1);
            document.getElementById('display-title').innerText = cleanTitle.toUpperCase();

            const fileName = game.gameUrl.split('/').pop();
            const fetchUrl = `https://fastly.jsdelivr.net/gh/goat-67/ugs-singlefile@main/UGS-Files/${fileName}`;

            fetch(fetchUrl)
                .then(r => r.text())
                .then(html => {
                    const frame = document.getElementById('game-frame');
                    let baseUrl = fetchUrl.substring(0, fetchUrl.lastIndexOf("/") + 1);
                    if (!baseUrl.endsWith('/')) baseUrl += '/';

                    // 2. THE PERFECT MOCK SDK (Matches your code snippet exactly)
                    const masterHeaders = `
                        <head>
                            <base href="${baseUrl}">
                            <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
                            <script>
                                // MOCK YSDK: Satisfies _GameplayStop_js and _IsFullscreen_js
                                window.ysdk = {
                                    features: {
                                        LoadingAPI: { ready: function() { console.log("SDK Ready"); } },
                                        GameplayAPI: {
                                            stop: function() { 
                                                console.log("Stop Intercepted - Forcing Start");
                                                if(window.ysdk.features.GameplayAPI.start) window.ysdk.features.GameplayAPI.start();
                                            },
                                            start: function() { console.log("Gameplay Resumed"); }
                                        }
                                    },
                                    screen: { fullscreen: { status: "on" } },
                                    adv: {
                                        showFullscreenAdv: function(opt) {
                                            if (opt && opt.callbacks && opt.callbacks.onClose) {
                                                setTimeout(() => { opt.callbacks.onClose(true); }, 100);
                                            }
                                        }
                                    },
                                    getStorage: function() { return Promise.resolve({}); }
                                };

                                // GLOBAL FUNCTIONS: Satisfies _FullAdShow and _InitGame_js
                                window.FullAdShow = function() { 
                                    console.log("Ad bypassed");
                                    if (window.unityInstance) {
                                        window.unityInstance.SendMessage('GameManager', 'ResumeGame');
                                        window.unityInstance.SendMessage('GameManager', 'Unpause');
                                    }
                                };
                                window.InitGame = function() { console.log("InitGame Successful"); };
                                window.BuyPayments = function() { return true; };
                                window.ConsumePurchases = function() { return true; };

                                // THE ENGINE UNBLOCKER (Runs 10 times a second)
                                window.setInterval(() => {
                                    window.isAdShowing = false;
                                    window.isPaused = false;
                                    // Forces the Unity Main Loop to stay active
                                    if (window.unityInstance && window.unityInstance.Module) {
                                        try { window.unityInstance.Module.resumeMainLoop(); } catch(e) {}
                                    }
                                }, 100);
                            <\/script>
                        </head>
                    `;

                    // 3. THE NUCLEAR INJECTION (Bypasses Local Resource Block)
                    const finalHtml = masterHeaders + html;
                    frame.src = "about:blank";
                    const frameDoc = frame.contentDocument || frame.contentWindow.document;
                    frameDoc.open();
                    frameDoc.write(finalHtml);
                    frameDoc.close();
                })
                .catch(err => {
                    document.getElementById('display-title').innerText = "LOAD ERROR";
                });
        }
    };

    function openFullscreen() {
        const elem = document.getElementById("game-frame");
        if (elem.requestFullscreen) { elem.requestFullscreen(); }
        else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); } 
    }
</script>








</body>
</html>
