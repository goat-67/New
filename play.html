<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDXP | Playing</title>
    <style>
   /* THE ACCENT LINE (Change from gold to Blue) */
nav {
    background-color: #0c0c0c;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    border-bottom: 2px solid #235bff; /* YOUR BLUE */
}

/* THE LOGO (Change from red to Blue) */
.logo {
    font-size: 38px;
    font-weight: 900;
    color: #235bff; /* YOUR BLUE */
    letter-spacing: -2px;
    text-transform: uppercase;
    text-shadow: 3px 3px 0px #000;
}

/* THE FULLSCREEN BUTTON (Change from orange to Blue) */
.fs-btn {
    background-color: #235bff; 
    color: white;
    border: none;
    padding: 8px 20px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
    font-size: 12px;
    transition: 0.2s;
}
.fs-btn:hover {
    background-color: #3e74ff;
    transform: scale(1.05);
}
</style>
</head>
<body>

    <nav>
        <div class="menu-icon" onclick="window.location.href='index.html'">
            <div></div><div></div><div></div>
        </div>
        <div class="logo" onclick="window.location.href='index.html'">SDXP</div>
    </nav>

    <div class="game-wrapper">
        <div class="iframe-container">
            <!-- Added allowfullscreen and allow="fullscreen" for Chromebooks -->
            <iframe id="game-frame" src="" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" allow="fullscreen"></iframe>
        </div>

        <div class="control-bar">
            <div id="display-title" class="game-title">Loading...</div>
            <button class="fs-btn" onclick="openFullscreen()">Fullscreen</button>
        </div>
    </div>

    <!-- 1. Load your games list (Change URL if your games.js moved) -->
    <script src="https://cdn.jsdelivr.net/gh/goat-67/ugs-singlefile@main/src/games.js"></script>

    <script>
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const gameId = params.get('id');
            
            // Check if list exists (Handles allGames or myGamesList)
            const list = typeof allGames !== 'undefined' ? allGames : (typeof myGamesList !== 'undefined' ? myGamesList : null);

            if (list && list[gameId]) {
                const game = list[gameId];
                let cleanTitle = game.name.startsWith('cl') ? game.name.substring(2) : game.name;
                document.getElementById('display-title').innerText = cleanTitle.toUpperCase();

                // THE BLOB FETCH (The filter bypass)
                const fileName = game.gameUrl.split('/').pop();
                const fetchUrl = `https://cdn.jsdelivr.net/gh/goat-67/ugs-singlefile@main/UGS-Files/${fileName}`;

                fetch(fetchUrl)
                    .then(r => r.text())
                    .then(html => {
                        const blob = new Blob([html], { type: 'text/html' });
                        document.getElementById('game-frame').src = URL.createObjectURL(blob);
                    })
                    .catch(err => {
                        document.getElementById('display-title').innerText = "FILTER BLOCKED DOWNLOAD";
                    });
            }
        };

        // FIXED FULLSCREEN FUNCTION
        function openFullscreen() {
            const elem = document.getElementById("game-frame");
            if (elem.requestFullscreen) { elem.requestFullscreen(); }
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); } // Chrome/Chromebooks
            else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); }
        }
    </script>
</body>
</html>
