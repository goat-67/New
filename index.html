/* ================= SEARCH ================= */

function sdxpSearch() {
    const input = document.getElementById('game-search');
    const resultsDiv = document.getElementById('search-results');
    const query = input.value.toLowerCase().trim();

    if (!query) {
        resultsDiv.style.display = "none";
        return;
    }

    const list = typeof allGames !== 'undefined' ? allGames : (typeof myGamesList !== 'undefined' ? myGamesList : []);

    const matches = list.filter(game => {
        let clean = game.name.startsWith('cl') ? game.name.substring(2) : game.name;
        return clean.toLowerCase().includes(query);
    }).slice(0, 7);

    resultsDiv.innerHTML = "";

    if (matches.length > 0) {
        resultsDiv.style.display = "block";

        matches.forEach(game => {
            let cleanName = game.name.startsWith('cl') ? game.name.substring(2) : game.name;
            const fileName = game.gameUrl.split('/').pop();

            const item = document.createElement('a');
            item.href = `play.html?id=${fileName}`;
            item.className = 'search-item';
            item.innerText = cleanName.toUpperCase();

            resultsDiv.appendChild(item);
        });

    } else {
        resultsDiv.innerHTML = `<div class="search-item" style="opacity:0.5">No results found</div>`;
        resultsDiv.style.display = "block";
    }
}

/* ================= PASSWORD ================= */

document.addEventListener("DOMContentLoaded", () => {
    const input = document.getElementById("password-input");
    const toggle = document.getElementById("toggle-password");

    if (input && toggle) {
        toggle.addEventListener("click", () => {
            const isHidden = input.type === "password";

function checkPassword() {
    const box = document.querySelector(".password-box");

    if (!box) return;

    box.classList.add("shake");
    setTimeout(() => box.classList.remove("shake"), 300);

    const inputValue = document.getElementById("password-input").value;
    const correctPassword = "chinknees foot fungus";

    if (inputValue === correctPassword) {
        sessionStorage.setItem("unlocked", "true");
        document.getElementById("password-overlay").style.display = "none";
    } else {
        document.getElementById("error-msg").innerText = "Wrong password";
    }
}

/* ================= TIMER SYSTEM ================= */

const MAX_TIME = 45 * 60 * 1000; // 45 minutes

function getTodayKey() {
    return new Date().toDateString();
}

function getData() {
    return JSON.parse(localStorage.getItem("timeData")) || null;
}

function saveData(data) {
    localStorage.setItem("timeData", JSON.stringify(data));
}

function initTimeLimit() {
    const today = getTodayKey();
    let data = getData();

    if (!data || data.date !== today) {
        data = {
            date: today,
            timeSpent: 0,
            lastStart: Date.now(),
            bonusTime: 0,
            bonusUsed: false
        };
    } else {
        data.lastStart = Date.now();
    }

    saveData(data);

    createTimerUI();
    updateLoop();
}

/* ================= TIMER UI ================= */

function createTimerUI() {
    if (document.getElementById("time-remaining")) return;

    const timer = document.createElement("div");
    timer.id = "time-remaining";

    timer.style.position = "fixed";
    timer.style.bottom = "15px";
    timer.style.right = "20px";
    timer.style.padding = "10px 14px";
    timer.style.background = "rgba(0,0,0,0.6)";
    timer.style.backdropFilter = "blur(8px)";
    timer.style.color = "#fff";
    timer.style.fontSize = "13px";
    timer.style.borderRadius = "10px";
    timer.style.zIndex = "9999";
    timer.style.fontWeight = "600";

    document.body.appendChild(timer);
}

/* ================= MAIN TIMER LOOP ================= */

function updateLoop() {
    setInterval(() => {
        let data = getData();
        if (!data) return;

        const now = Date.now();

        const sessionTime = now - data.lastStart;
        const totalAllowed = MAX_TIME + (data.bonusTime || 0);
        const used = data.timeSpent + sessionTime;

        const remaining = totalAllowed - used;

        const timerEl = document.getElementById("time-remaining");

        if (timerEl) {
            timerEl.innerText = remaining > 0
                ? "Time Left: " + formatTime(remaining)
                : "Time Left: 0:00";
        }

        if (remaining <= 0) {
            lockSite();
            return;
        }

        data.timeSpent = used;
        data.lastStart = now;

        saveData(data);

    }, 1000);
}

function formatTime(ms) {
    let totalSeconds = Math.floor(ms / 1000);
    let minutes = Math.floor(totalSeconds / 60);
    let seconds = totalSeconds % 60;
    return `${minutes}:${seconds.toString().padStart(2, '0')}`;
}

/* ================= BONUS SYSTEM ================= */

window.addEventListener("load", () => {
    const input = document.getElementById("bonus-input");

    if (input) {
        input.addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                if (this.value === "67") {
                    give15Minutes();
                    this.value = "";
                }
            }
        });
    }
});

function give15Minutes() {
    let data = getData();
    if (!data) return;

    if (!data.bonusUsed) data.bonusUsed = false;
    if (data.bonusUsed) return;

    const BONUS = 15 * 60 * 1000;

    data.bonusTime = (data.bonusTime || 0) + BONUS;
    data.bonusUsed = true;

    saveData(data);
}

    `;
}
