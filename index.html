<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDXP | ULTIMATE GAME HUB</title>
    
    <style>
       /* 1. Official Matte Grey Background */
html, body { 
    background-color: #2b2b2b; /* The specific grey from your image */
    color: #fff; 
    font-family: 'Segoe UI', sans-serif; 
    margin: 0; padding: 0;
}

/* 2. Compact Grid Layout (10-11 per row) */
#sections-container {
    display: grid;
    /* Reduced min-width to 90px to fit more per row */
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 12px; /* Tighter spacing like the image */
    padding: 30px 40px;
    max-width: 1600px;
    margin: 0 auto;
}

.game-btn {
    aspect-ratio: 1 / 1;
    /* 1. Subtle Dark Base - slightly darker than the body */
    background-color: #1e1e1e; 
    color: #888; /* Dimmed text for a "Ghost" look */
    border-radius: 16px;
    display: flex; 
    align-items: center; 
    justify-content: center;
    font-weight: 700;
    font-size: 8.5px;
    text-transform: uppercase;
    text-align: center;
    padding: 12px;
    /* 2. Soft shadow so they don't look flat */
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    border: 1px solid #333; 
    cursor: pointer;
    transition: all 0.2s ease;
    word-break: break-word;
}

.game-btn:hover { 
    /* 3. High-Contrast Hover - Button pops forward */
    transform: translateY(-5px) scale(1.1);
    background-color: #333; 
    color: #fff; /* Text lights up white */
    border-color: #fff; /* Crisp white border highlight */
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    z-index: 10;
}




        nav {
    background-color: #2b2b2b; /* Same as body */
    height: 75px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    position: sticky; /* Keeps it at the top when you scroll */
    top: 0;
    z-index: 2000;
    
    /* THE "POP" EFFECT: Heavy shadow makes it look 3D */
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05); /* Very faint highlight edge */
}


        /* MENU ICON */
        .menu-icon {
            position: absolute;
            left: 25px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 1100;
        }
        .menu-icon div { width: 30px; height: 3px; background-color: #fff; transition: 0.3s; }

        /* SIDEBAR */
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 2050;
            top: 0;
            left: 0;
            background-color: #0c0c0c;
            overflow-x: hidden;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding-top: 60px;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 36px;
            color: #818181;
            cursor: pointer;
            text-decoration: none;
        }

        .sidebar a {
            padding: 15px 25px;
            text-decoration: none;
            font-size: 18px;
            color: #818181;
            display: block;
            transition: 0.3s;
            border-left: 3px solid transparent;
        }
        .sidebar a:hover { color: #d4af37; background: #151515; border-left: 3px solid #d4af37; }

        /* LOGO */
        .logo {
            font-size: 45px;
            font-weight: 900;
            color: #2e5bff; 
            letter-spacing: -2px;
            text-transform: uppercase;
            text-shadow: 0 10px 25px rgba(0, 0, 0, 0.9);
            cursor: pointer;
        }

        /* 3. SOLID GOLD UPDATE BAR */
        .update-bar {
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fcf6ba, #bf953f);
            padding: 12px 0;
            text-align: center;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 900;
            color: #2a2005; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 100%;
        }

        /* 4. FLOATING SEARCH SYSTEM */
        .search-wrapper { position: absolute; right: 40px; width: 280px; }
        
        .game-search {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px 15px;
            color: #fff;
            outline: none;
            font-size: 14px;
            transition: 0.2s;
        }
        .game-search:focus { border-color: #d4af37; background: #000; }

        #search-results {
            position: absolute;
            top: 55px;
            right: 0;
            width: 100%;
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: 12px;
            display: none;
            z-index: 2000;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
            max-height: 450px;
            overflow-y: auto;
        }

        .search-item {
            display: block;
            padding: 14px 18px;
            color: #eee;
            text-decoration: none;
            font-size: 14px;
            border-bottom: 1px solid #1a1a1a;
            transition: 0.2s;
        }
        .search-item:hover { background: #1a1a1a; color: #ff3e3e; }

       

     
}

    </style>
</head>
<body>

    <!-- Sidebar -->
    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="close-btn" onclick="toggleNav()">&times;</a>
        <h2 style="color: #fff; padding-left: 25px; font-size: 14px; opacity: 0.5; margin-top: 40px;">UNBLOCKED LINKS</h2>
        <a href="https://strongdog.com" target="_blank">strongdog.com</a>
        <a href="#"></a>
        <a href="https://github.com" target="_blank">GitHub Profile</a>
    </div>

    <!-- Navigation -->
    <nav>
        <div class="menu-icon" onclick="toggleNav()">
            <div></div><div></div><div></div>
        </div>
        <div class="logo" onclick="window.location.reload()">SDXP</div>
        
        <div class="search-wrapper">
            <input type="text" id="game-search" class="game-search" placeholder="Search 1,205 games..." oninput="sdxpSearch()">
            <div id="search-results"></div>
        </div>
    </nav>

    <!-- Update Bar -->
    <div class="update-bar">UPDATE: 1,205 GAMES LOADED — FIXING SCHOOL LINKS</div>

    <!-- Games Container -->
    <div id="sections-container"></div>

<script>
    // SIDEBAR TOGGLE
    function toggleNav() {
        const sidebar = document.getElementById("mySidebar");
        sidebar.style.width = (sidebar.style.width === "250px") ? "0" : "250px";
    }

    function sdxpSearch() {
    const input = document.getElementById('game-search');
    const resultsDiv = document.getElementById('search-results');
    const query = input.value.toLowerCase().trim();

    // 1. Hide dropdown if search bar is empty
    if (query.length < 1) {
        resultsDiv.style.display = "none";
        return;
    }

    // 2. Filter through your list (using 'allGames' or 'myGamesList')
    const list = typeof allGames !== 'undefined' ? allGames : (typeof myGamesList !== 'undefined' ? myGamesList : []);
    
    // Find up to 7 matches
    const matches = list.filter(game => {
        let clean = game.name.startsWith('cl') ? game.name.substring(2) : game.name;
        return clean.toLowerCase().startsWith(query);
    }).slice(0, 7);

    // 3. Build the floating dropdown
    resultsDiv.innerHTML = "";
    if (matches.length > 0) {
        resultsDiv.style.display = "block";
        matches.forEach(game => {
            let cleanName = game.name.startsWith('cl') ? game.name.substring(2) : game.name;
            
            // FIND THE TRUE ID (INDEX) of this game in the main list
            const gameId = list.indexOf(game); 
            
            // Link using the ID so play.html can use the Blob Loader
            resultsDiv.innerHTML += `
                <a href="play.html?id=${gameId}" class="search-item">
                    ${cleanName}
                </a>`;
        });
    } else {
        resultsDiv.innerHTML = `<div class="search-item" style="opacity:0.5">No results found</div>`;
        resultsDiv.style.display = "block";
    }
}


    // Close search if clicking outside
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-wrapper')) {
            document.getElementById('search-results').style.display = "none";
        }
    });

    // GAME LOADER
    window.GAME_HASH = "5591b2216ed9a3b4be843b5b1a38a5915e4af084"; 
    const script = document.createElement('script');
    script.src = ` https://cdn.jsdelivr.net/gh/goat-67/ugs-singlefile@${window.GAME_HASH}/src/games.js`;
    
    script.onload = () => { 
        if (typeof buildStash === 'function') {
            buildStash(); 
        }
    };
    document.head.appendChild(script);
</script>

</body>
</html>
