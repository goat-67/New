<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDXP | ULTIMATE GAME HUB</title>
    
    <style>
        /* 1. Base Layout */
        html, body { 
            background-color: #1a1a1a; 
            color: #fff; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        /* 2. Navigation Bar */
        nav {
            background-color: #080808;
            height: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 40px;
            position: relative;
            z-index: 1001;
            border-bottom: 1px solid #1a1a1a;
        }

        /* MENU ICON (LEFT) */
        .menu-icon {
            position: absolute;
            left: 25px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 1100;
        }
        .menu-icon div { width: 30px; height: 3px; background-color: #fff; transition: 0.3s; }

        /* SIDEBAR */
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1050;
            top: 0;
            left: 0;
            background-color: #0c0c0c;
            overflow-x: hidden;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding-top: 60px;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }

        /* CLOSE BUTTON INSIDE SIDEBAR */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 36px;
            color: #818181;
            cursor: pointer;
            text-decoration: none;
        }
        .close-btn:hover { color: #fff; }

        .sidebar a {
            padding: 15px 25px;
            text-decoration: none;
            font-size: 18px;
            color: #818181;
            display: block;
            transition: 0.3s;
            border-left: 3px solid transparent;
        }
        .sidebar a:hover { color: #d4af37; background: #151515; border-left: 3px solid #d4af37; }

        /* LOGO */
        .logo {
            font-size: 45px;
            font-weight: 900;
            color: #ff3e3e; 
            letter-spacing: -2px;
            text-transform: uppercase;
            text-shadow: 0 10px 25px rgba(0, 0, 0, 0.9), 0 15px 40px rgba(0, 0, 0, 0.6);
        }

        /* 3. SOLID GOLD UPDATE BAR */
        .update-bar {
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fcf6ba, #bf953f);
            padding: 12px 0;
            text-align: center;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 900;
            color: #2a2005; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 100%;
        }

        /* 4. SEARCH WRAPPER */
        .search-wrapper { position: absolute; right: 40px; width: 240px; }
        .game-search {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px 15px;
            color: #fff;
            outline: none;
        }
        .game-search:focus { border-color: #d4af37; }

        #search-dropdown {
            position: absolute;
            top: 45px;
            right: 0;
            width: 100%;
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: 4px;
            display: none;
            z-index: 2000;
        }
        .search-item {
            display: block;
            padding: 12px;
            color: #eee;
            text-decoration: none;
            border-bottom: 1px solid #222;
            font-size: 13px;
        }
        .search-item:hover { background: #1a1a1a; color: #ff3e3e; }

        /* 5. ICON GRID */
        #sections-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
            padding: 40px 60px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .game-btn {
            aspect-ratio: 1 / 1;
            background: #2b2b2b;
            border-radius: 22px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            color: #fff; 
            font-weight: bold;
            text-decoration: none; 
            transition: transform 0.2s, background 0.2s;
            text-align: center;
            padding: 10px;
        }
        .game-btn:hover { transform: scale(1.08); background: #d4af37; color: #000; }
    </style>
</head>
<body>

    <div id="mySidebar" class="sidebar">
        <!-- CLOSE BUTTON -->
        <a href="javascript:void(0)" class="close-btn" onclick="toggleNav()">&times;</a>
        
        <h2 style="color: #fff; padding-left: 25px; font-size: 14px; opacity: 0.5; margin-top: 40px;">UNBLOCKED LINKS</h2>
        <a href="https://strongdog.com" target="_blank">strongdog.com</a>
        <a href="#"></a> <!-- Blank mirror link -->
        <a href="https://github.com" target="_blank">GitHub Profile</a>
    </div>

    <nav>
        <div class="menu-icon" onclick="toggleNav()">
            <div></div><div></div><div></div>
        </div>
        <div class="logo">SDXP</div>
        <div class="search-wrapper">
            <input type="text" id="game-search" class="game-search" placeholder="Search 1,205 games..." onkeyup="sdxpSearch()">
            <div id="search-dropdown"></div>
        </div>
    </nav>

    <div class="update-bar">
        UPDATE: 1,205 GAMES LOADED — FIXING SCHOOL LINKS
    </div>

    <div id="sections-container"></div>

<script>
    // SIDEBAR TOGGLE
    function toggleNav() {
        const sidebar = document.getElementById("mySidebar");
        sidebar.style.width = (sidebar.style.width === "250px") ? "0" : "250px";
    }

    // SEARCH LOGIC (Links directly to game URL since you don't have play.html)
    function sdxpSearch() {
        let input = document.getElementById('game-search').value.toLowerCase();
        let dropdown = document.getElementById('search-dropdown');
        
        if (input.length < 1) {
            dropdown.style.display = "none";
            return;
        }

        if (typeof myGamesList === 'undefined') return;

        let matches = myGamesList.filter(g => g.name.toLowerCase().includes(input)).slice(0, 6);
        dropdown.innerHTML = "";
        
        if (matches.length > 0) {
            dropdown.style.display = "block";
            matches.forEach(game => {
                // Pointing directly to the game's URL
                dropdown.innerHTML += `<a href="${game.url}" class="search-item">${game.name}</a>`;
            });
        } else {
            dropdown.innerHTML = `<div class="search-item" style="opacity:0.5">No games found</div>`;
            dropdown.style.display = "block";
        }
    }

    // REPO LOADER
    const script = document.createElement('script');
    script.src = `https://cdn.jsdelivr.net`;
    
    script.onload = () => { 
        if (typeof buildStash === 'function') {
            buildStash(); 
        }
    };
    document.head.appendChild(script);
</script>

</body>
</html>
