<body>
    <!-- THE UPDATE BAR (Message Head) -->
    <div class="update-bar">
        <b>UPDATE:</b> 1,205 GAMES LOADED. WORKING ON FIXING LINKS FOR SCHOOL COMPUTERS.
    </div>

    <nav>
        <div class="logo">SDXP</div>
        
        <div class="search-wrapper">
            <input type="text" id="game-search" class="game-search" placeholder="Search 1,200 games..." onkeyup="sdxpSearch()">
            <div id="search-dropdown"></div>
        </div>
    </nav>

    <div id="sections-container">
        <!-- Your games.js will build the icons here -->
    </div>

<script>
    // Search function with Top 5 results
    function sdxpSearch() {
        let input = document.getElementById('game-search').value.toLowerCase();
        let dropdown = document.getElementById('search-dropdown');
        if (input.length < 2) { dropdown.style.display = "none"; return; }

        // Change 'myGamesList' if your array has a different name in games.js
        if (typeof myGamesList === 'undefined') return;

        let matches = myGamesList.filter(g => g.name.toLowerCase().includes(input)).slice(0, 5);
        dropdown.innerHTML = "";
        
        if (matches.length > 0) {
            dropdown.style.display = "block";
            matches.forEach(game => {
                dropdown.innerHTML += `<a href="play.html?name=${encodeURIComponent(game.name)}" class="search-item">${game.name}</a>`;
            });
        } else {
            dropdown.style.display = "none";
        }
    }
</script>
</body>
