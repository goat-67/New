<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDXP | ULTIMATE GAME HUB</title>
    
   <style>
    /* 1. BASE LAYOUT - MATTE CHARCOAL */
    html, body { 
        background-color: #2b2b2b; 
        color: #fff; 
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        margin: 0; padding: 0;
        overflow-x: hidden;
    }

    /* 2. FLOATING NAVIGATION BAR */
    nav {
        background-color: #121212;
        height: 75px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 30px;
        position: relative; /* REQUIRED for logo centering */
        z-index: 2000;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    /* MENU ICON (LEFT) */
    .menu-icon { cursor: pointer; z-index: 1100; position: relative; }
    .menu-icon div { width: 25px; height: 3px; background: #fff; margin-bottom: 5px; transition: 0.3s; }

    /* ELECTRIC COBALT LOGO (ABSOLUTE CENTER) */
    .logo {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%); /* Mathematical Dead Center */
        font-size: 42px;
        font-weight: 900;
        color: #235bff; /* Your Electric Cobalt */
        letter-spacing: -2.5px;
        text-transform: uppercase;
        /* Double Shadow: Sharp Edge + Deep Blue Glow */
        text-shadow: 
            3px 3px 0px #000, 
            0 0 20px rgba(35, 91, 255, 0.4);
        cursor: pointer;
        white-space: nowrap;
        transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .logo:hover {
        transform: translate(-50%, -55%) scale(1.05);
        text-shadow: 3px 3px 0px #000, 0 0 30px rgba(35, 91, 255, 0.7);
    }

    /* NAV RIGHT (SEARCH & GRID) */
    .nav-right { display: flex; align-items: center; gap: 15px; position: relative; z-index: 1100; }
    
    .grid-icon { display: grid; grid-template-columns: repeat(3, 4px); gap: 3px; cursor: pointer; opacity: 0.6; }
    .grid-icon div { width: 4px; height: 4px; background: #fff; border-radius: 1px; }

    /* PILL SEARCH BAR */
    .search-wrapper { position: relative; width: 230px; }
    .game-search {
        width: 100%;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 20px;
        padding: 10px 18px;
        color: #fff;
        font-size: 13px;
        outline: none;
        transition: 0.2s;
    }
    .game-search:focus { border-color: #235bff; box-shadow: 0 0 10px rgba(35, 91, 255, 0.3); }

    /* FLOATING SEARCH DROPDOWN */
    #search-results {
        position: absolute;
        top: 50px;
        right: 0;
        width: 280px;
        background: #151515;
        border: 1px solid #333;
        border-radius: 12px;
        display: none;
        z-index: 3000;
        box-shadow: 0 15px 40px rgba(0,0,0,0.9);
        max-height: 400px;
        overflow-y: auto;
    }
    .search-item { 
        display: block; padding: 14px 18px; color: #eee; 
        text-decoration: none; font-size: 13px; border-bottom: 1px solid #222; 
        transition: 0.2s;
    }
    .search-item:hover { background: #1f1f1f; color: #235bff; }

    /* 3. SOLID GOLD UPDATE BAR (Metallic Polish) */
    .update-bar {
        background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fcf6ba, #bf953f);
        padding: 12px 0;
        text-align: center;
        font-size: 0.85rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-weight: 900;
        color: #2a2005; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        width: 100%;
    }

    /* 4. PREMIUM SLATE GAME GRID */
    #sections-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
        gap: 14px;
        padding: 30px 45px;
        max-width: 1600px;
        margin: 0 auto;
    }

    /* THE PREMIUM SQUIRCLES (3D Deep Slate) */
    .game-btn {
        aspect-ratio: 1 / 1;
        background-color: #1e1e1e; /* Deep Slate */
        color: #888; /* Soft White/Grey Text */
        border-radius: 20px;
        display: flex; 
        align-items: center; 
        justify-content: center;
        font-weight: 800;
        font-size: 8.5px;
        text-transform: uppercase;
        text-align: center;
        padding: 12px;
        border: 1px solid #333;
        cursor: pointer;
        
        /* 3D DEPTH: Inset light edge + Heavy outer shadow */
        box-shadow: 
            inset 0 1px 1px rgba(255, 255, 255, 0.05), 
            0 8px 15px rgba(0,0,0,0.4);
        
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        word-break: break-word;
    }

    .game-btn:hover { 
        transform: translateY(-8px) scale(1.15); /* Jumps toward user */
        background-color: #252525;
        color: #fff; /* Text lights up white */
        
        /* ELECTRIC COBALT ACCENT - Matches Logo */
        border-color: #235bff; 
        box-shadow: 
            0 0 20px rgba(35, 91, 255, 0.4), 
            0 15px 35px rgba(0,0,0,0.7);
        z-index: 10;
    }
</style>

</head>
<body>

    <!-- Sidebar -->
    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="close-btn" onclick="toggleNav()">&times;</a>
        <h2 style="color: #fff; padding-left: 25px; font-size: 14px; opacity: 0.5; margin-top: 40px;">UNBLOCKED LINKS</h2>
        <a href="https://strongdog.com" target="_blank">strongdog.com</a>
        <a href="#"></a>
        <a href="https://github.com" target="_blank">GitHub Profile</a>
    </div>

    <!-- Navigation -->
    <nav>
        <div class="menu-icon" onclick="toggleNav()">
            <div></div><div></div><div></div>
        </div>
        <div class="logo" onclick="window.location.reload()">SDXP</div>
        
        <div class="search-wrapper">
            <input type="text" id="game-search" class="game-search" placeholder="Search 1,205 games..." oninput="sdxpSearch()">
            <div id="search-results"></div>
        </div>
    </nav>

    <!-- Update Bar -->
    <div class="update-bar">UPDATE: 1,205 GAMES LOADED — FIXING SCHOOL LINKS</div>

    <!-- Games Container -->
    <div id="sections-container"></div>

<script>
    // SIDEBAR TOGGLE
    function toggleNav() {
        const sidebar = document.getElementById("mySidebar");
        sidebar.style.width = (sidebar.style.width === "250px") ? "0" : "250px";
    }

    function sdxpSearch() {
    const input = document.getElementById('game-search');
    const resultsDiv = document.getElementById('search-results');
    const query = input.value.toLowerCase().trim();

    // 1. Hide dropdown if search bar is empty
    if (query.length < 1) {
        resultsDiv.style.display = "none";
        return;
    }

    // 2. Filter through your list (using 'allGames' or 'myGamesList')
    const list = typeof allGames !== 'undefined' ? allGames : (typeof myGamesList !== 'undefined' ? myGamesList : []);
    
    // Find up to 7 matches
    const matches = list.filter(game => {
        let clean = game.name.startsWith('cl') ? game.name.substring(2) : game.name;
        return clean.toLowerCase().startsWith(query);
    }).slice(0, 7);

    // 3. Build the floating dropdown
    resultsDiv.innerHTML = "";
    if (matches.length > 0) {
        resultsDiv.style.display = "block";
        matches.forEach(game => {
            let cleanName = game.name.startsWith('cl') ? game.name.substring(2) : game.name;
            
            // FIND THE TRUE ID (INDEX) of this game in the main list
            const gameId = list.indexOf(game); 
            
            // Link using the ID so play.html can use the Blob Loader
            resultsDiv.innerHTML += `
                <a href="play.html?id=${gameId}" class="search-item">
                    ${cleanName}
                </a>`;
        });
    } else {
        resultsDiv.innerHTML = `<div class="search-item" style="opacity:0.5">No results found</div>`;
        resultsDiv.style.display = "block";
    }
}


    // Close search if clicking outside
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-wrapper')) {
            document.getElementById('search-results').style.display = "none";
        }
    });

    // GAME LOADER
    window.GAME_HASH = "5591b2216ed9a3b4be843b5b1a38a5915e4af084"; 
    const script = document.createElement('script');
    script.src = ` https://cdn.jsdelivr.net/gh/goat-67/ugs-singlefile@${window.GAME_HASH}/src/games.js`;
    
    script.onload = () => { 
        if (typeof buildStash === 'function') {
            buildStash(); 
        }
    };
    document.head.appendChild(script);
</script>

</body>
</html>
