<!DOCTYPE html>

    <title>UGH Math</title> 
    <script>
    (function() {
        const BLOCKED = 'cdn.jsdelivr.net';
        const WORKING = 'fastly.jsdelivr.net';
        
        // This part intercepts background requests
        const originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url) {
            if (typeof url === 'string' && url.includes(BLOCKED)) {
                url = url.replace(BLOCKED, WORKING);
            }
            return originalOpen.apply(this, arguments);
        };

        // This part intercepts elements being added to the page
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                mutation.addedNodes.forEach((node) => {
                    const attr = node.tagName === 'LINK' ? 'href' : 'src';
                    if (node[attr] && typeof node[attr] === 'string' && node[attr].includes(BLOCKED)) {
                        node[attr] = node[attr].replace(BLOCKED, WORKING);
                    }
                });
            });
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
    })();
    </script>
