<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDXP | ULTIMATE GAME HUB</title>
    
    <style>
        /* 1. Base Layout */
        html, body { 
            background-color: #1a1a1a; 
            color: #fff; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        /* 2. Navigation Bar */
        nav {
            background-color: #080808;
            height: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 40px;
            position: relative;
            z-index: 1001;
            border-bottom: 1px solid #1a1a1a;
        }

        /* MENU ICON (LEFT) */
        .menu-icon {
            position: absolute;
            left: 25px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 1100;
        }
        .menu-icon div { width: 30px; height: 3px; background-color: #fff; transition: 0.3s; }

        /* SIDEBAR */
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1050;
            top: 0;
            left: 0;
            background-color: #0c0c0c;
            overflow-x: hidden;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding-top: 60px;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }

        /* CLOSE BUTTON INSIDE SIDEBAR */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 36px;
            color: #818181;
            cursor: pointer;
            text-decoration: none;
        }
        .close-btn:hover { color: #fff; }

        .sidebar a {
            padding: 15px 25px;
            text-decoration: none;
            font-size: 18px;
            color: #818181;
            display: block;
            transition: 0.3s;
            border-left: 3px solid transparent;
        }
        .sidebar a:hover { color: #d4af37; background: #151515; border-left: 3px solid #d4af37; }

        /* LOGO */
        .logo {
            font-size: 45px;
            font-weight: 900;
            color: #ff3e3e; 
            letter-spacing: -2px;
            text-transform: uppercase;
            text-shadow: 0 10px 25px rgba(0, 0, 0, 0.9), 0 15px 40px rgba(0, 0, 0, 0.6);
        }

        /* 3. SOLID GOLD UPDATE BAR (Metallic Gradient + Dark Text) */
        .update-bar {
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fcf6ba, #bf953f);
            padding: 12px 0;
            text-align: center;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 900;
            color: #2a2005; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 100%;
        }

        /* 4. SEARCH WRAPPER */
        .search-wrapper { position: absolute; right: 40px; width: 240px; }
        .game-search {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px 15px;
            color: #fff;
            outline: none;
        }
        .game-search:focus { border-color: #d4af37; }

        /* 5. GAME GRID & SECTIONS */
        #sections-container {
            padding: 40px 60px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .game-section {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            width: 100%;
        }

        .letter-header {
            grid-column: 1 / -1; 
            font-size: 24px;
            font-weight: bold;
            color: #444;
            margin-bottom: 10px;
            border-bottom: 1px solid #222;
        }

        .game-btn {
            aspect-ratio: 1 / 1;
            background: #2b2b2b;
            border-radius: 22px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            color: #fff; 
            font-weight: bold;
            text-decoration: none; 
            transition: transform 0.2s, background 0.2s;
            text-align: center;
            padding: 10px;
            border: none;
            cursor: pointer;
        }
        .game-btn:hover { 
            transform: scale(1.08); 
            background: #d4af37; 
            color: #000; 
        }
    </style>
</head>
<body>

    <!-- SIDEBAR NAVIGATION -->
    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="close-btn" onclick="toggleNav()">&times;</a>
        
        <h2 style="color: #fff; padding-left: 25px; font-size: 14px; opacity: 0.5; margin-top: 40px;">UNBLOCKED LINKS</h2>
        <a href="https://strongdog.com" target="_blank">Strongdog XP</a>
        <a href="#"> Game Link</a> <!-- Blank link as requested -->
        <a href="#">Game Link</a>
    </div>

    <!-- TOP NAVIGATION -->
    <nav>
        <div class="menu-icon" onclick="toggleNav()">
            <div></div><div></div><div></div>
        </div>
        <div class="logo">SDXP</div>
        <div class="search-wrapper">
            <input type="text" id="game-search" class="game-search" placeholder="Search 1,200 games...">
        </div>
    </nav>

    <!-- METALLIC GOLD BAR -->
    <div class="update-bar">
        UPDATE: 1,205 GAMES LOADED — FIXING SCHOOL LINKS
    </div>

    <!-- GAME CONTAINER -->
    <div id="sections-container"></div>

<script>
    // SIDEBAR TOGGLE LOGIC
    function toggleNav() {
        const sidebar = document.getElementById("mySidebar");
        sidebar.style.width = (sidebar.style.width === "250px") ? "0" : "250px";
    }

    // NEW HASH (e75b5...)
    window.GAME_HASH = "21c478149b8170480769152ef8fefa850932703f"; 
    
    const script = document.createElement('script');
    // Added the missing semicolon at the end of this line:
    script.src = `https://cdn.jsdelivr.net/gh/goat-67/ugs-singlefile@${window.GAME_HASH}/src/games.js`;
    
    script.onload = () => { 
        if (typeof buildStash === 'function') {
            buildStash(); 
        }
    };
    document.head.appendChild(script);
</script>


</body>
</html>
